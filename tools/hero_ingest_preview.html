<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무속성 주인공 · 원소 구슬 먹기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14261e;color:#f5edd5;font:16px system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:26px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6;color:#bed1ae}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}button,select{font:inherit;padding:11px 17px;border:1px solid #6a8055;border-radius:9px;color:#f5eed8;background:#2e5039;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px}.card{border:1px solid #526a49;border-radius:14px;background:#233e30;text-align:center;padding:16px 5px}h2{font-size:19px;margin:0}canvas{width:100%;max-width:340px;aspect-ratio:340/332}.state{height:28px;color:#d3e0b7;font-size:14px}.hint{font-size:14px}.toolbar label{display:flex;gap:10px;align-items:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}</style>
<main><h1>무속성 주인공 · 원소 구슬 먹기</h1><p>입 벌리기 → 구슬 끌어당기기 → 삼키기 → 대기 자세</p><div class="toolbar"><label>원소 <select id="element"><option value="water">물</option><option value="fire">불</option><option value="wind">바람</option><option value="earth">흙</option><option value="lightning">번개</option></select></label><button id="eat">먹기 (F)</button><button id="pause">일시정지</button><label><input id="loop" type="checkbox" checked>반복 재생</label></div><div id="grid" class="grid"></div><p class="hint">발 위치를 유지합니다. 뒷모습에서는 구슬을 캐릭터 뒤에 그립니다.</p></main>
<script>
const data=/* ASSET_DATA */;
const hero=new Image(),idle=new Image(),orbs={};hero.src=data.hero;idle.src=data.idle;for(const [key,src] of Object.entries(data.orbs)){orbs[key]=new Image();orbs[key].src=src}
const cards=[];const names=['정면','왼쪽','오른쪽','뒷면'];let last=null,paused=false,phase='idle',elapsed=0,idleTime=0,wait=450,consumed=false,activeElement='water',orbAvailable=true;
for(let row=0;row<4;row++){const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${names[row]}</h2><canvas width="340" height="332" aria-label="${names[row]} 먹기 애니메이션"></canvas><div class="state">구슬 앞에서 대기</div>`;document.querySelector('#grid').append(card);cards.push({row,direction:data.directions[row],canvas:card.querySelector('canvas'),ctx:card.querySelector('canvas').getContext('2d'),status:card.querySelector('.state')})}
function start(){if(phase==='ingest'||paused)return false;phase='ingest';elapsed=0;consumed=false;orbAvailable=true;activeElement=document.querySelector('#element').value;return true}
document.querySelector('#eat').onclick=start;document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='f'&&!event.repeat&&!['SELECT','INPUT'].includes(event.target.tagName)){event.preventDefault();start()}});
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재개':'일시정지'};
document.querySelector('#element').onchange=()=>{if(phase==='idle'){activeElement=document.querySelector('#element').value;orbAvailable=true;wait=450}};
function draw(card){const {ctx:c,row,direction}=card;c.clearRect(0,0,340,332);const frame=phase==='ingest'?Math.min(7,Math.floor(elapsed/1000*12)):Math.floor(idleTime/1000*4)%8;const sheet=phase==='ingest'?hero:idle;let orb=null;
if(orbAvailable&&!consumed){const amount=phase==='ingest'?Math.max(0,Math.min(1,(elapsed/1000-1/12)/(2/12))):0;const smooth=amount*amount*(3-2*amount),a=data.starts[direction],b=data.mouths[direction];orb={x:a[0]+(b[0]-a[0])*smooth,y:a[1]+(b[1]-a[1])*smooth,size:48*(1-amount*.9)}}
function paintOrb(){if(orb&&orbs[activeElement].complete&&orbs[activeElement].naturalWidth)c.drawImage(orbs[activeElement],42+orb.x*2-orb.size/2,28+orb.y*2-orb.size/2,orb.size,orb.size)}
if(direction==='up')paintOrb();if(sheet.complete&&sheet.naturalWidth)c.drawImage(sheet,frame*128,row*128,128,128,42,28,256,256);if(direction!=='up')paintOrb();card.status.textContent=phase==='ingest'?(consumed?'구슬 삼키기':elapsed<166?'입 벌리기':'구슬 끌어당기기'):(consumed?'먹기 완료 · 대기':'구슬 앞에서 대기')}
function tick(now){const dt=last===null?0:Math.max(0,Math.min(100,now-last));last=now;if(!paused){if(phase==='ingest'){elapsed+=dt;if(!consumed&&elapsed>=4/12*1000){consumed=true;orbAvailable=false}if(elapsed>=8/12*1000){phase='idle';idleTime=0;wait=850}}else{idleTime+=dt;wait-=dt;if(document.querySelector('#loop').checked&&wait<=0)start()}}document.querySelector('#eat').disabled=paused||phase==='ingest';cards.forEach(draw);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
