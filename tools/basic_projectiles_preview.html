<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>엘리먼트 이터 · 원소별 기본 공격 투사체</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11251d;color:#f5efd9;font:16px/1.65 system-ui,'Malgun Gothic',sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px}h1{font-size:30px;line-height:1.3;margin:8px 0 12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#c6df9b}p{color:#bbcebb;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:24px 0}button,select{font:inherit;background:#2e503b;color:#fff3d5;border:1px solid #64845e;border-radius:9px;padding:10px 15px;cursor:pointer}label{display:flex;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#203c2e;border:1px solid #48674c;border-radius:16px;overflow:hidden}.body{padding:18px 18px 0}h2{font-size:23px;margin:0}.desc{font-size:14px;min-height:47px}.scene,.loop{display:block;width:100%;height:auto}.loop{background:#193226;border-top:1px solid #3d5d43}.status{font-size:13px;color:#c3d79d;padding:10px 18px;min-height:42px}.note{font-size:13px}.fallback{max-width:960px;width:100%;height:auto}#error{color:#ffc9a2}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{padding:22px 14px}.grid{grid-template-columns:1fr}h1{font-size:25px}.desc{min-height:0}}</style></head>
<body><main><div class="eyebrow">ELEMENT EATER · BASIC PROJECTILES</div><h1>원소별로 다르게 날아가는 기본 공격</h1><p>캐릭터의 입에서 발사되는 모습과 확대 비행 루프를 함께 확인합니다.</p>
<div class="toolbar"><label>발사 방향 <select id="direction"><option value="right">오른쪽</option><option value="left">왼쪽</option><option value="down">정면</option><option value="up">뒷면</option></select></label><button id="fire">한 번 발사 (Space)</button><button id="pause">일시정지</button><label>재생 속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label><input id="auto" type="checkbox" checked>자동 시연</label></div>
<div id="fallback"><img class="fallback" src="/* FALLBACK */" alt="6종 기본 공격 투사체의 움직이는 비행 루프"></div><div class="grid" id="grid"></div><p id="error" role="alert"></p>
<p class="note">Space 기본 공격용 시각 시안입니다. 물 자가 치유·불 화상·바람 강한 넉백·흙벽·번개 연쇄 공격은 R 고유 능력으로 구분합니다. 발사 3번 프레임·12fps·속도·크기는 시험값이며 Python/pico2d 본게임 전투 판정은 아직 연결하지 않았습니다.</p></main>
<script>
const DATA=/* DATA */;
const dirs=['down','left','right','up'],cache=new Map(),cards=[];
let age=0,last=null,paused=false,nextAuto=0;
function image(key){if(!cache.has(key)){const img=new Image();img.onload=drawAll;img.onerror=()=>{document.querySelector('#error').textContent='일부 이미지를 불러오지 못했습니다. 아래 움직이는 비교 이미지를 확인해 주세요.'};img.src=DATA.images[key];cache.set(key,img)}return cache.get(key)}
for(const [element,entry] of Object.entries(DATA.projectiles.elements)){const node=document.createElement('section');node.className='card';node.innerHTML=`<div class="body"><h2>${entry.name} · ${entry.title}</h2><p class="desc">${entry.description}</p></div><canvas class="scene" width="420" height="300" aria-label="${entry.name} 캐릭터 발사 시연"></canvas><canvas class="loop" width="420" height="140" aria-label="${entry.name} 확대 비행 루프"></canvas><div class="status">이미지 불러오는 중</div>`;document.querySelector('#grid').append(node);cards.push({element,node,scene:node.querySelector('.scene'),loop:node.querySelector('.loop'),cast:null})}
function fire(){if(paused)return;for(const card of cards){card.cast={time:age,direction:document.querySelector('#direction').value}}nextAuto=age+2200}
document.querySelector('#fire').onclick=fire;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재개':'일시정지'};
document.querySelector('#direction').onchange=drawAll;document.querySelector('#auto').onchange=()=>{nextAuto=age+500};
document.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat&&!['SELECT','INPUT','BUTTON'].includes(event.target.tagName)){event.preventDefault();fire()}});
function projectile(ctx,element,direction,t,x,y,scale){const img=image('projectile/'+element),row=dirs.indexOf(direction),frame=Math.floor(t*12)%8;if(!img.complete||!img.naturalWidth)return false;ctx.drawImage(img,frame*160,row*160,160,160,x-80*scale,y-80*scale,160*scale,160*scale);return true}
function drawAll(){let ready=true;for(const card of cards){const {element}=card,c=card.scene.getContext('2d'),l=card.loop.getContext('2d'),cast=card.cast,elapsed=cast?(age-cast.time)/1000:-1,active=cast&&elapsed<1.6,direction=active?cast.direction:document.querySelector('#direction').value,row=dirs.indexOf(direction),entry=DATA.heroes[element];
c.clearRect(0,0,420,300);l.clearRect(0,0,420,140);const center={right:[80,156],left:[340,156],down:[210,78],up:[210,235]}[direction],origin=[center[0]-64,center[1]-76],hero=image('hero/'+element+'/'+(active&&elapsed<8/12?'attack':'idle')),frame=active&&elapsed<8/12?Math.min(7,Math.floor(elapsed*12)):Math.floor(age/1000*4)%8;
const shot=()=>{if(active&&elapsed>=.25){const v={down:[0,1],left:[-1,0],right:[1,0],up:[0,-1]}[direction],m=entry.mouths[direction],d=(elapsed-.25)*160;return projectile(c,element,direction,elapsed-.25,origin[0]+m[0]+v[0]*d,origin[1]+m[1]+v[1]*d,.5)}return true};
if(direction==='up')ready=shot()&&ready;if(hero.complete&&hero.naturalWidth)c.drawImage(hero,frame*128,row*128,128,128,origin[0],origin[1],128,128);else ready=false;if(direction!=='up')ready=shot()&&ready;
ready=projectile(l,element,document.querySelector('#direction').value,age/1000,230,78,1.15)&&ready;l.fillStyle='#b9ceab';l.font='13px system-ui';l.fillText('확대 비행 루프',14,22);card.node.querySelector('.status').textContent=active?(elapsed<.25?'공격 준비':elapsed<8/12?'발사 · 공격 동작':'비행 중'):'대기 · Space로 발사';
}if(ready)document.querySelector('#fallback').hidden=true}
function tick(now){const dt=last===null?0:Math.max(0,Math.min(100,now-last));last=now;if(!paused)age+=dt*Number(document.querySelector('#speed').value);if(!paused&&document.querySelector('#auto').checked&&age>=nextAuto)fire();drawAll();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
