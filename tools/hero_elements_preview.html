<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원소 캐릭터 · 4가지 애니메이션</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14261e;color:#f5edd5;font:16px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:25px}h1{margin:0 0 10px;font-size:26px}p{color:#bdcfac;line-height:1.6}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:24px 0}label{display:flex;align-items:center;gap:8px}button,select{font:inherit;color:#f6ecd5;background:#2d5039;border:1px solid #64805a;border-radius:9px;padding:10px 15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:15px}.card{border:1px solid #526b49;border-radius:14px;background:#233e30;padding:16px 7px;text-align:center}.card h2{font-size:19px;margin:0}canvas{width:100%;max-width:300px;aspect-ratio:1}.status{min-height:25px;color:#c7d9ad;font-size:14px}.hint{font-size:14px}@media(max-width:850px){main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<main><h1>원소별 캐릭터 · 대기·걷기·기본 공격·구슬 먹기</h1><p>원소와 방향을 바꾸어 네 가지 동작을 비교할 수 있습니다.</p><div class="toolbar"><label>원소 <select id="element"><option value="neutral">기본</option><option value="water">물</option><option value="fire">불</option><option value="wind">바람</option><option value="earth">흙</option><option value="lightning">번개</option></select></label><label>방향 <select id="direction"><option value="down">정면</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="up">뒷면</option></select></label><button id="pause">일시정지</button><button id="restart">다시 재생</button><label><input type="checkbox" id="anchor">몸통 중심 표시</label></div><div class="grid" id="grid"></div><p class="hint">기본 공격과 구슬 먹기는 단발 동작입니다. 비교 화면에서는 대기 자세를 사이에 두고 반복합니다.</p></main>
<script>
const catalog=/* CATALOG */;
const embeddedImages=/* EMBEDDED_IMAGES */;
const STATES=['idle','walk','attack','ingest'];
const cache=new Map(),cards=[];let age=0,last=null,paused=false;
function imageFor(key){if(!cache.has(key)){const image=new Image();cache.set(key,image);image.onload=()=>drawAll();image.onerror=()=>drawAll();image.src=embeddedImages[key]}return cache.get(key)}
function orbFor(element){return imageFor(`orbs/${element}-orb.png`)}
for(const state of STATES){const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${catalog.elements.water.states[state].label}</h2><canvas width="256" height="256" aria-label="${catalog.elements.water.states[state].label} 애니메이션"></canvas><div class="status"></div>`;document.querySelector('#grid').append(card);cards.push({state,canvas:card.querySelector('canvas'),ctx:card.querySelector('canvas').getContext('2d'),status:card.querySelector('.status')})}
function drawAll(){const element=document.querySelector('#element').value,direction=document.querySelector('#direction').value,row=['down','left','right','up'].indexOf(direction),entry=catalog.elements[element],t=age/1000;
for(const card of cards){const c=card.ctx;c.clearRect(0,0,256,256);const state=card.state,info=entry.states[state],phase=t%2;let sheetState=state,frame,elapsed=null;
if(info.loop)frame=Math.floor(t*info.fps)%8;else if(phase<.4||phase>=.4+8/12){sheetState='idle';frame=0}else{elapsed=phase-.4;frame=Math.min(7,Math.floor(elapsed*12))}
const image=imageFor(entry.states[sheetState].image),orb=orbFor(element);
function drawOrb(){let x,y,size;if(state==='attack'&&elapsed!==null&&elapsed>=.25){const m=entry.mouths[direction],v={down:[0,1],left:[-1,0],right:[1,0],up:[0,-1]}[direction],distance=(elapsed-.25)*150;x=m[0]+v[0]*distance;y=m[1]+v[1]*distance;size=9}else if(state==='ingest'&&phase<.4+4/12){const start={down:[64,125],left:[12,74],right:[116,74],up:[64,6]}[direction],goal=entry.ingestMouths[direction],p=Math.max(0,Math.min(1,((elapsed??0)-1/12)/(2/12))),ease=p*p*(3-2*p);x=start[0]+(goal[0]-start[0])*ease;y=start[1]+(goal[1]-start[1])*ease;size=21*(1-p*.9)}else return;if(orb.complete&&orb.naturalWidth)c.drawImage(orb,x*1.7+19-size*.85,y*1.7+12-size*.85,size*1.7,size*1.7)}
if(direction==='up')drawOrb();if(image.complete&&image.naturalWidth){c.drawImage(image,frame*128,row*128,128,128,19,12,217.6,217.6);document.querySelector('#fallback').hidden=true;card.status.textContent=info.loop?'반복 동작':elapsed===null?'대기 자세':'동작 재생 중'}else{card.status.textContent=image.complete?'이미지를 불러오지 못했습니다':'이미지 불러오는 중'}if(direction!=='up')drawOrb();
if(document.querySelector('#anchor').checked){const x=19+catalog.torsoTarget[0]*1.7,y=12+catalog.torsoTarget[1]*1.7;c.save();c.strokeStyle='#ffffff';c.globalAlpha=.65;c.beginPath();c.moveTo(x-8,y);c.lineTo(x+8,y);c.moveTo(x,y-8);c.lineTo(x,y+8);c.stroke();c.restore()}
}}
document.querySelector('#element').onchange=()=>{age=0;drawAll()};document.querySelector('#direction').onchange=()=>{age=0;drawAll()};document.querySelector('#anchor').onchange=drawAll;document.querySelector('#restart').onclick=()=>{age=0;drawAll()};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재개':'일시정지'};
function tick(now){const dt=last===null?0:Math.max(0,Math.min(100,now-last));last=now;if(!paused)age+=dt;drawAll();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
