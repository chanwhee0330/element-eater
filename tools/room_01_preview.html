<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>첫 번째 방 · 시작 섬과 근접 추격</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a17;color:#eee9d9;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{color:#bdcbbd;line-height:1.6;font-size:14px}button{border:1px solid #718b71;background:#263c30;color:#f1ecd9;border-radius:7px;padding:9px 16px;cursor:pointer}#status{display:inline-block;margin-left:14px;color:#e7ce8e;font-size:14px}#stage{position:relative;margin-top:16px;text-align:center;border:1px solid #48594c;border-radius:10px;overflow:hidden;background:#09121a}canvas,#fallback{width:100%;display:block}canvas{position:absolute;inset:0;visibility:hidden;outline:none}#stage.live canvas{position:relative;visibility:visible}#stage.live #fallback{display:none}small{display:block;color:#93a895;line-height:1.6;margin-top:12px}#pausePanel{display:none;margin-top:12px;padding:12px;background:#28352b}#pausePanel.visible{display:block}
</style>
<main><h1>첫 번째 방 · 시작 섬</h1>
<p>WASD 이동 · Esc 일시정지<br>좁은 길을 올라 큰 구역에 들어가면 근접 적 2마리가 추격합니다. 원거리 적 2마리는 배치만 표시합니다.</p>
<button id="reset">처음부터 보기</button> <button id="demo">진입·추격 시연</button><span id="status" role="status">이미지 준비 중…</span>
<div id="pausePanel">일시정지 <button id="resume">계속하기</button> <button id="restart">방 재시작</button></div>
<div id="stage"><img id="fallback" src="FALLBACK_IMAGE" alt="첫 방 지도: 아래 시작 섬과 양옆 낭떠러지, 좁은 길 위 전투 구역과 중앙 벽"><canvas id="view" tabindex="0" aria-label="WASD로 이동하는 첫 방 배치 미리보기"></canvas></div>
<small>20×22칸 · 무속성 근접 2 / 원거리 2 · 고정 크기와 발밑 기준점 사용<br>이 HTML은 지도·이동·추격 시연용입니다. 공격·체력·게임 HUD가 있는 Python/pico2d 버전은 저장소 main.py로 실행합니다.</small></main>
<script>
/*ROOM_LOGIC*/
const map=/*ROOM_DATA*/null, sources=/*ROOM_IMAGES*/null;
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),status=document.getElementById('status');
canvas.width=map.columns*48;canvas.height=map.rows*48;
let state=Room01Logic.create(map),images={},keys={},paused=false,last=null,started=false,demo=false;
const unit=48,dirs=['down','left','right','up'];
function reset(){state=Room01Logic.create(map);keys={};paused=false;demo=false;last=null;document.getElementById('pausePanel').classList.remove('visible');canvas.focus();}
document.getElementById('reset').onclick=reset;document.getElementById('restart').onclick=reset;
document.getElementById('demo').onclick=()=>{reset();demo=true;};
function pause(value){paused=value;keys={};document.getElementById('pausePanel').classList.toggle('visible',paused);}
document.getElementById('resume').onclick=()=>{pause(false);canvas.focus();};
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.code==='Space')return;const k=e.key.toLowerCase();if(['w','a','s','d','escape'].includes(k)){e.preventDefault();if(k==='escape'&&!e.repeat)pause(!paused);else {demo=false;keys[k]=true;}}});
addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);addEventListener('blur',()=>{if(started)pause(true);});
document.addEventListener('visibilitychange',()=>{keys={};last=null;if(document.hidden&&started)pause(true);});
function text(label,x,y,color='#eee9d9'){ctx.font='15px system-ui';ctx.textAlign='center';const w=ctx.measureText(label).width;ctx.fillStyle='#14221fe8';ctx.fillRect(x*unit-w/2-7,y*unit-17,w+14,24);ctx.fillStyle=color;ctx.fillText(label,x*unit,y*unit);}
function actor(a,kind){const moving=a.moving&&!paused,frame=kind==='hero'?128:160,pivot=kind==='hero'?[64,114]:[80,138],scale=unit/map.heroReferenceHeight;
 const sprite=images[kind+'-'+(moving?'walk':'idle')],fps=moving?10:kind==='hero'?4:6,index=Math.floor(state.time*fps)%8,row=dirs.indexOf(a.facing);
 let fallScale=1,alpha=1;if(kind==='hero'&&state.fall>0){fallScale=Math.max(.08,state.fall/map.preview.fallSeconds);alpha=fallScale;}
 ctx.save();ctx.translate(a.x*unit,a.y*unit);ctx.globalAlpha=alpha;ctx.scale(fallScale,fallScale);ctx.drawImage(sprite,index*frame,row*frame,frame,frame,-pivot[0]*scale,-pivot[1]*scale,frame*scale,frame*scale);ctx.restore();}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(images.world,0,0,canvas.width,canvas.height);
 ctx.strokeStyle=state.aggro?'#cc7755':'#edc973';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(9*unit,11*unit);ctx.lineTo(11*unit,11*unit);ctx.stroke();ctx.setLineDash([]);
 text(state.aggro?'추격 활성화':'큰 구역 진입선',10,11.65,'#edcf8d');text('벽',10,7.15);text('낭떠러지',5,14);text('낭떠러지',15,14);text('시작 섬',10,20.7);text('출구 예정',10,2.8);
 const actors=state.enemies.map(a=>[a,a.behaviorType]);actors.push([state.player,'hero']);actors.sort((a,b)=>a[0].y-b[0].y);for(const [a,k]of actors){actor(a,k);if(k!=='hero')text((k==='melee'?'근접 ':'원거리 ')+a.id.slice(-1),a.x,a.y+.65,k==='melee'?'#efc392':'#b6d5e9');}
 if(state.spike&&Math.sin(state.time*22)>0){ctx.fillStyle='#ff5b4633';ctx.beginPath();ctx.arc(state.player.x*unit,state.player.y*unit-15,24,0,Math.PI*2);ctx.fill();}
 status.textContent=paused?'일시정지':state.fall>0?'낙하 시각 시안 · 안전 위치로 복귀':state.aggro?'근접 적 2마리 추격 중':'시작 섬 · 근접 적 대기';}
function loop(time){const dt=last===null?0:(time-last)/1000;last=time;if(!paused)Room01Logic.update(state,demo?{w:state.player.y>9.4}:keys,dt);draw();stage.classList.add('live');requestAnimationFrame(loop);}
Promise.all(Object.entries(sources).filter(([k])=>k!=='fallback').map(([k,src])=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images[k]=img;resolve();};img.onerror=reject;img.src=src;}))).then(()=>{started=true;requestAnimationFrame(loop);}).catch(()=>status.textContent='지도 이미지로 표시 중 · 재생 이미지를 불러오지 못했습니다');
</script></html>
